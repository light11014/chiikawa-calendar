services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chiikawa}
      POSTGRES_USER: ${POSTGRES_USER:-chiikawa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"   # 로컬 개발 전용. 운영에서는 제거
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
