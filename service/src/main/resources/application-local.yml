server:
  # actuator 전체를 열어 두므로 외부에서 접근하지 못하게 한다
  address: 127.0.0.1

spring:
  docker:
    compose:
      # 루트 compose를 써야 루트 .env를 읽는다. 상대경로라 service/에서 실행해야 한다
      file: ../docker-compose.yml
      start:
        arguments: postgres
      lifecycle-management: start-only

logging:
  level:
    com.chiikawa: DEBUG
    org.hibernate.SQL: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
