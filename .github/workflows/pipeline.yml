name: pipeline

on:
  pull_request:
    paths:
      - "pipeline/**"
      - "contracts/**"
  push:
    branches: [main]
    paths:
      - "pipeline/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4

      - name: Check project exists
        id: check
        run: |
          if [ -f pyproject.toml ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.exists == 'true'
        with:
          python-version: "3.12"

      - name: Install
        if: steps.check.outputs.exists == 'true'
        run: pip install -e ".[dev]"

      - name: Test
        if: steps.check.outputs.exists == 'true'
        run: pytest
